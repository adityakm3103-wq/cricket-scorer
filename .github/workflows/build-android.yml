name: Build Cricket Scorer Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      - name: Synchronize Capacitor Android
        working-directory: frontend
        run: npm run cap:sync

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          if [ ! -f frontend/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK file not found at expected location!"
            ls -la frontend/android/app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "APK successfully generated:"
          ls -lh frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Cricket Scorer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Scorer-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
