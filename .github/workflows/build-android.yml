name: Build Cricket Scorer Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      - name: Synchronize Capacitor Android
        working-directory: frontend
        run: |
          npx --yes @capacitor/cli sync android 2>&1 | tee sync.log || {
            echo "### Capacitor Sync Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat sync.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          if grep -q "BUILD SUCCESSFUL" build.log; then
            echo "Gradle build completed successfully."
          else
            echo "Gradle build failed."
            exit 1
          fi

      - name: Save Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs || git checkout ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          if [ -f frontend/android/build.log ]; then
            cp frontend/android/build.log ./gradle_build.log
          else
            echo "No build.log found" > ./gradle_build.log
          fi
          git add gradle_build.log
          git commit -m "ci: upload gradle build log [skip ci]" || true
          git push origin ci-logs --force || true

      - name: Verify APK Generation
        run: |
          find frontend/android -name "*.apk" -ls || true
          APK_FILE=$(find frontend/android -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file was generated!"
            exit 1
          fi
          echo "APK successfully found at: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "### APK Generation Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "Successfully generated APK: \`$APK_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh "$APK_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Cricket Scorer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Scorer-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
