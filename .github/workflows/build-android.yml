name: Build Cricket Scorer Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      - name: Synchronize Capacitor Android
        working-directory: frontend
        run: |
          npx --yes @capacitor/cli sync android 2>&1 | tee sync.log || {
            echo "### Capacitor Sync Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat sync.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "### Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Verify APK Generation
        run: |
          echo "Searching for generated APK files..."
          find frontend/android -name "*.apk" -ls || true
          APK_FILE=$(find frontend/android -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file was generated!"
            echo "### Build Outputs directory contents:"
            find frontend/android/app/build -maxdepth 4 || true
            exit 1
          fi
          echo "APK successfully found at: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "### APK Generation Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "Successfully generated APK: \`$APK_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh "$APK_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Cricket Scorer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Scorer-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
